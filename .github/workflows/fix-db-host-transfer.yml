name: Apply Undercover host and DB fix
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/fix-db-host-transfer.yml'
      - 'scripts/fix_undercover_host_db.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/fix_undercover_host_db.py
      - run: npm install
      - run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "Undercover updater"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/room/route.ts app/page.tsx app/RoomCommsPersistent.tsx app/upgrades.css lib/db.ts lib/store.ts lib/chat-store.ts lib/voice-store.ts
          git commit -m "Fix connection pressure and add host transfer"
          git push origin main
      - name: Remove migration files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-db-host-transfer.yml scripts/fix_undercover_host_db.py
          git commit -m "Remove temporary host-transfer migration"
          git push origin main
